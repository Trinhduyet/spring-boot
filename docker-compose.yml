services:
  api:
    build: .
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
